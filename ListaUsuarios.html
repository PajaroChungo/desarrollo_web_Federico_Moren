<!DOCTYPE html>
<html lang="es">
<head>
     <meta charset="UTF-8">
     <title> Lista de Usuarios - Actividades DCC </title>
     <style>
        .cargo.visible {
            display: block;
        }
        .cargo {
            display: none;
        }

        .bloqueUsuario {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .bloqueUsuario p {
        margin: 0.3rem 0; 
        }

    </style>
<body>
    <h1> Lista de Usuarios </h1>
    <p> A continuación se muestran todos los usuarios de la plataforma.</p>
    <p> Use el buscador y los filtros para encontrar a un usuario en específico.</p>
    <br>
    <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
        <input type="text" id="buscador" placeholder="Buscar por nombre de usuario">
        <br>
        <div>
            <label for="filtro-tipo">Filtrar por Tipo:</label>
            <select id="filtro-tipo">
                <option value="">Todos los tipos</option>
                <option value="estudiante_post">Estudiante de postgrado</option>
                <option value="estudiante_pre">Estudiante de pregrado</option>
                <option value="funcionario">Funcionario</option>
                <option value="academico">Académico</option>
            </select>
        </div>
        <br>
        <div class="cargo" id="DivFiltroCargo">
            <label for="filtro-cargo">Filtrar por cargo (solo para funcionarios):</label>
            <select id="filtro-cargo">
                <option value="">Todos los cargos</option>
                <option value="administrativo">Administrativo</option>
                <option value="profesional">Profesional</option>
                <option value="coordinador">Coordinador</option>
                <option value="jefatura">Jefatura</option>
                <option value="auxiliar">Auxiliar</option>
            </select>
        </div>
        <br>
        <div>
            <label for="ordenar-por">Ordenar por:</label>
            <select id="ordenar-por">
                <option value="nombre">Nombre</option>
                <option value="apellido">Apellido</option>
                <option value="correo">Correo</option>
            </select>
        </div>
    </div>

    <div id="lista-usuarios"></div>

    <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
        <button id="boton-anterior">Anterior</button>
        <span id="pagina-actual"></span>
        <button id="boton-siguiente">Siguiente</button>
    </div>
    <br>
<button type="button" onclick="window.location.href= 'Inicio.html'">Volver al inicio</button>
<button type="button" onclick="window.location.href='Pagina_Registro.html'">Registrarse</button>
<button type="button" onclick="window.location.href='Publicar_actividades.html'">Actividades</button>
<button type="button" onclick="window.location.href='Metricas.html'">Métricas</button>
<script src="ListaUsuarios.js"></script>
</body>
</html>
